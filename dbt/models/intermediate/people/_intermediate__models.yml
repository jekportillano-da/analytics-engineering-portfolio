version: 2

models:
  - name: int_employment_spells_validated
    description: Employment spells with explicit validity flags and no silent deletion.
    columns:
      - name: employment_id
        data_tests: [not_null, unique]
      - name: worker_id
        data_tests: [not_null]

  - name: int_job_history_validated
    description: Job assignments with temporal and reference validation flags.
    columns:
      - name: job_history_id
        data_tests: [not_null, unique]

  - name: int_date_spine
    columns:
      - name: calendar_date
        data_tests: [not_null, unique]

  - name: int_active_employment_daily
    description: One row for every valid employment spell on every active date.
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: employment_id
        data_tests: [not_null]
      - name: worker_id
        data_tests: [not_null]
