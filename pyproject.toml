[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "analytics-engineering-portfolio"
version = "0.1.0"
description = "A reusable, multi-domain analytics engineering platform and portfolio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-bigquery==1.12.0",
    "dbt-core==1.12.3",
    "dbt-duckdb==1.10.1",
    "duckdb==1.5.5",
    "google-cloud-bigquery==3.44.0",
    "pyyaml>=6.0,<7",
]

[project.scripts]
people-local-demo = "analytics_platform.domains.people.cli:main"
people-bigquery-demo = "analytics_platform.domains.people.bigquery_cli:main"

[dependency-groups]
test = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_platform"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
