[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "analytics-engineering-portfolio"
version = "0.1.0"
description = "A reusable, multi-domain analytics engineering platform and portfolio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_platform"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
